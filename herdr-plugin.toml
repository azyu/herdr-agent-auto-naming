id = "azyu.agent-auto-naming"
name = "Agent Auto Naming"
version = "0.4.0"
min_herdr_version = "0.9.0"
description = "Give every detected agent a readable two-word name, persisted as the pane label"
platforms = ["linux", "macos", "windows"]

[[events]]
on = "pane.agent_detected"
platforms = ["linux", "macos"]
command = ["python3", "auto_name.py"]

[[events]]
on = "pane.agent_detected"
platforms = ["windows"]
command = ["py", "-3", "auto_name.py"]

# `/clear` and `/new` replace the agent session in place. Herdr clears the agent name
# for it but reports no detection, so the pane keeps its label while the agent shows as
# the bare runtime again. No event marks the replacement; a status change is the first
# one that follows it, and name_pane rebinds the label from there. codex and omp recover
# on the next prompt (herdr 0.9.1). Claude Code usually recovers within seconds of the
# command, otherwise on its next turn (herdr 0.9.5, Claude Code 2.1.301).
[[events]]
on = "pane.agent_status_changed"
platforms = ["linux", "macos"]
command = ["python3", "auto_name.py"]

[[events]]
on = "pane.agent_status_changed"
platforms = ["windows"]
command = ["py", "-3", "auto_name.py"]

[[startup]]
platforms = ["linux", "macos"]
command = ["python3", "auto_name.py"]

[[startup]]
platforms = ["windows"]
command = ["py", "-3", "auto_name.py"]

[[actions]]
id = "name-all"
title = "Name unnamed agents"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["python3", "auto_name.py"]

[[actions]]
id = "name-all-windows"
title = "Name unnamed agents"
contexts = ["workspace"]
platforms = ["windows"]
command = ["py", "-3", "auto_name.py"]
